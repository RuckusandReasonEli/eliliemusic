<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eli Lie</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0812">
<script>
  // Any wrong address under /eliliemusic/ lands here. Send people to the right page,
  // forgiving capital letters, trailing punctuation and missing ".html".
  (function () {
    var base = "/eliliemusic/";
    var pages = { "": "", index: "", home: "", studio: "", music: "music.html", listen: "music.html",
      shows: "shows.html", tour: "shows.html", games: "games.html", game: "games.html",
      join: "join.html", list: "join.html", signup: "join.html", "mailing-list": "join.html" };
    var path = decodeURIComponent(location.pathname).toLowerCase();
    var i = path.indexOf("eliliemusic");
    var rest = i === -1 ? "" : path.slice(i + "eliliemusic".length);
    var slug = rest.split("/").filter(Boolean)[0] || "";
    slug = slug.replace(/[^a-z0-9-]+$/g, "").replace(/\.html?$/, "").replace(/[^a-z0-9-]+$/g, "");
    var target = base + (Object.prototype.hasOwnProperty.call(pages, slug) ? pages[slug] : "");
    location.replace(target + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="2; url=/eliliemusic/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0812; color: #f3e6c4; font: 22px/1.3 ui-monospace, monospace; text-align: center; }
  a { color: #ffc857; }
</style>
</head>
<body>
<p>Wrong room. Taking you to the studio...<br><a href="/eliliemusic/">Go now</a></p>
</body>
</html>
